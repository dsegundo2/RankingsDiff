name: Check source rankings

on:
  workflow_dispatch:
    inputs:
      commit_updates:
        description: Commit refreshed Yahoo-adjusted rankings and generated static data
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pylint pandas openpyxl
      - name: Download fresh ESPN rankings
        run: python scripts/download_rankings.py espn --season 2026
      - name: Download fresh Yahoo adjusted rankings
        run: python scripts/download_rankings.py hayden-winks --season 2026
      - name: Rebuild comparison datasets
        run: |
          python scripts/rankings_diff_espn.py --season 2026
          python scripts/rankings_diff_fpros.py --season 2026
      - name: Check source ranking checksums
        run: python scripts/check_source_rankings.py --copy-to-public --force
      - name: Prepare frontend data
        run: python scripts/prepare_frontend_data.py
      - name: Show changed generated files
        run: git status --short data/status frontend/public/data/status frontend/public/data/manifest.json
      - name: Commit refreshed rankings and generated data
        if: ${{ github.event_name == 'schedule' || inputs.commit_updates == 'true' }}
        run: |
          git add data/raw/2026 frontend/public/data/2026 \
            data/status frontend/public/data/status frontend/public/data/manifest.json
          if git diff --cached --quiet; then
            echo "No refreshed ranking or generated status changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh ESPN and Yahoo adjusted rankings"
          git push
      - name: Deploy refreshed frontend data
        if: ${{ github.event_name == 'schedule' || inputs.commit_updates == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
